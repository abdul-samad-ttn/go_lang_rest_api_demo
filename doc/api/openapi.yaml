openapi: 3.0.3
info:
  title: Post API (SQLite)
  description: |
    REST API under `/api/v1`. JSON shapes for posts/comments match
    [JSONPlaceholder](https://jsonplaceholder.typicode.com/guide/) for Next.js integration.

    **Local server:** `http://localhost:8080` (see `config/local.yml`).

    **Auth (target v1):** protected routes use `Authorization: Bearer <JWT>` from `POST /auth/login`.

  version: 0.2.0

  x-implementation-status: |
    **Shipped locally (2026-11-22):** Health, posts GET, comments GET/POST/DELETE/PATCH (stretch).
    **Interim author checks (until M4 JWT):** `POST` comment sends `userId` in JSON body;
    `DELETE` and `PATCH` comment send `userId` query (`?userId=1`, camelCase).
    **Error bodies today:** plain text via `http.Error` (not JSON `{"error"}`) — M8 polish.
  contact:
    name: go_lang_rest_api
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Posts
  - name: Comments
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: API is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (client discards token)
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /posts:
    get:
      tags: [Posts]
      summary: List all posts
      operationId: listPosts
      responses:
        "200":
          description: Array of posts (seeded count 50 in v1)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Posts]
      summary: Create a post
      description: `userId` is set from JWT; body must not rely on `userId`.
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /posts/{id}:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      tags: [Posts]
      summary: Get post by ID
      operationId: getPostById
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Posts]
      summary: Delete post (author only)
      operationId: deletePost
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted (comments cascade)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{postId}/comments:
    parameters:
      - $ref: "#/components/parameters/PostIdPath"
    get:
      tags: [Comments]
      summary: List comments for a post
      operationId: listCommentsByPost
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Comments]
      summary: Create comment on a post
      description: |
        Author stored as `author_user_id` (not in response JSON).

        **Interim (no JWT):** include `userId` in the JSON body (seed user id). Target v1 uses JWT only.
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequestPlain"
        "404":
          $ref: "#/components/responses/NotFoundPlain"
        "500":
          $ref: "#/components/responses/ServerErrorPlain"

  /comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    get:
      tags: [Comments]
      summary: Get comment by ID
      operationId: getCommentById
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequestPlain"
        "404":
          $ref: "#/components/responses/NotFoundPlain"
    patch:
      tags: [Comments]
      summary: Partially update comment (author only, stretch)
      description: |
        Send any of `name`, `body` (at least one required). Omitted fields are unchanged.

        **Interim (no JWT):** required query `userId` must match `author_user_id`.
      operationId: patchComment
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
            examples:
              bodyOnly:
                summary: Update body only
                value:
                  body: Updated body text
              nameOnly:
                summary: Update name only
                value:
                  name: Updated name
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Invalid ids, empty body, empty `{}`, or empty name/body when provided
          content:
            text/plain:
              schema:
                type: string
              examples:
                emptyBody:
                  value: Empty body
                invalidName:
                  value: Invalid name
        "403":
          $ref: "#/components/responses/ForbiddenPlain"
        "404":
          $ref: "#/components/responses/NotFoundPlain"
        "500":
          $ref: "#/components/responses/ServerErrorPlain"
    delete:
      tags: [Comments]
      summary: Delete comment (author only)
      description: |
        **Interim (no JWT):** required query `userId` must match `author_user_id`.
      operationId: deleteComment
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "204":
          description: Deleted (empty body)
        "400":
          $ref: "#/components/responses/BadRequestPlain"
        "403":
          $ref: "#/components/responses/ForbiddenPlain"
        "404":
          $ref: "#/components/responses/NotFoundPlain"
        "500":
          $ref: "#/components/responses/ServerErrorPlain"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from POST /auth/login

  parameters:
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PostIdPath:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserIdQuery:
      name: userId
      in: query
      required: true
      description: Interim author id (seed user). Replaced by JWT in M4.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Error:
      type: object
      properties:
        error:
          type: string

    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        displayName:
          type: string

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    Post:
      type: object
      required: [id, userId, title, body]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string

    CreatePostRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string

    Comment:
      type: object
      required: [id, postId, name, email, body]
      properties:
        id:
          type: integer
          format: int64
        postId:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        body:
          type: string

    CreateCommentRequest:
      type: object
      required: [name, email, body, userId]
      description: Interim includes `userId` until JWT auth (M4).
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        body:
          type: string
        userId:
          type: integer
          format: int64
          minimum: 1
          description: Author user id (interim; from JWT later)

    UpdateCommentRequest:
      type: object
      description: At least one of `name` or `body` must be present (non-null in JSON).
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed (e.g. not post/comment owner)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequestPlain:
      description: Validation error (plain text today)
      content:
        text/plain:
          schema:
            type: string
          example: Invalid comment id
    NotFoundPlain:
      description: Resource not found (plain text today)
      content:
        text/plain:
          schema:
            type: string
          example: Comment not found
    ForbiddenPlain:
      description: Not allowed (plain text today)
      content:
        text/plain:
          schema:
            type: string
          example: Forbidden
    ServerErrorPlain:
      description: Internal error (plain text today)
      content:
        text/plain:
          schema:
            type: string
          example: Internal server error